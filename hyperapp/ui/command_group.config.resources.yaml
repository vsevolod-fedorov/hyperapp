import:
- legacy_type.builtin:string
- legacy_type.cfg_item:typed_cfg_item
- legacy_type.command:canned_args_command_key
- legacy_type.command:global_model_command_key
- legacy_type.command:model_command_key
- legacy_type.command:ui_command_key
- legacy_type.layout:layout_ui_command_key
- legacy_type.system:item_list_config
- legacy_type.system:system_config

definitions:

  config:
    type: legacy_type.system:system_config
    value:
      services:
        command_group_type_reg: command_group_type_reg.config

  command_group_type_reg.config:
    type: legacy_type.system:item_list_config
    value:
      items:
      - model_command_key.cfg-item
      - global_model_command_key.cfg-item
      - ui_command_key.cfg-item
      - canned_arg_command_key.cfg-item
      - layout_ui_command_key.cfg-item

  model_command_key.cfg-item:
    type: legacy_type.cfg_item:typed_cfg_item
    value:
      t: legacy_type.command:model_command_key
      value: context.string

  global_model_command_key.cfg-item:
    type: legacy_type.cfg_item:typed_cfg_item
    value:
      t: legacy_type.command:global_model_command_key
      value: global.string

  ui_command_key.cfg-item:
    type: legacy_type.cfg_item:typed_cfg_item
    value:
      t: legacy_type.command:ui_command_key
      value: view.string

  canned_arg_command_key.cfg-item:
    type: legacy_type.cfg_item:typed_cfg_item
    value:
      t: legacy_type.command:canned_args_command_key
      value: context.string

  layout_ui_command_key.cfg-item:
    type: legacy_type.cfg_item:typed_cfg_item
    value:
      t: legacy_type.layout:layout_ui_command_key
      value: context.string

  context.string:
    type: legacy_type.builtin:string
    value: context

  global.string:
    type: legacy_type.builtin:string
    value: global

  view.string:
    type: legacy_type.builtin:string
    value: view
