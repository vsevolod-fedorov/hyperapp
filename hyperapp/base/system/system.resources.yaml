          code.config_ctl: base:system/ctl.config_ctl:config_ctl.module
          code.config_item_ctl: base:system/ctl.config_item_ctl:config_item_ctl.module
          code.config_layer: base:system/config_layer:config_layer.module
          code.services: base:system/services:services.module
          code.actor_template: base:system/actor_template:actor_template.module
          code.service_template: base:system/service_template:service_template.module
        raw: {}

  actor.value_ctl:
    type: system.t:actor_value_ctl
    value: {}

  data.value_ctl:
    type: system.t:data_value_ctl
    value: {}

  single.struct_ctl:
