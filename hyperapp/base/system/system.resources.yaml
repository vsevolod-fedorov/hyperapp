definitions:

  config_creg.service:
    type: system.t:config_creg
    value: {}

  adapter_creg.service:
    type: system.t:adapter_creg
    value: {}

  service_creg.service:
    type: system.t:service_creg
    value: {}

  service_config_creg.service:
    type: system.t:service_config_creg
    value: {}

  system.module:
    type: builtin:type:python_module
    value:
      module_name: system
      file_name: system.dyn.py
      imports:
        pyobj:
          services.web: builtin:service:web
          code.resolving_code_registry: resolving_code_registry:resolving_code_registry.module
          code.config: config:config.module
        raw:
          data.system.service.adapter_creg: adapter_creg.service
          data.system.service.service_creg: service_creg.service
          data.system.service.service_config_creg: service_config_creg.service

  service_config_creg:
    type: builtin:type:attribute
    value:
      object: system.module
      attr_name: service_config_creg

  service_config_creg.service-actor:
    type: system.t:service_actor
    value:
      fn: service_config_creg
      adapters:
      - adapter:service_object.adapter
