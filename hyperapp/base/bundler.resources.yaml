import:
- base:system/system:actor_dict.config_ctl
- builtin:service:association_reg
- builtin:service:mosaic
- builtin:service:pyobj_creg
- builtin:type:attribute
- builtin:type:python_module
- :system/system.t:service_template

definitions:

  bundler.module:
    type: builtin:type:python_module
    value:
      module_name: bundler
      file_name: bundler.dyn.py
      imports:
        pyobj:
          services.association_reg: builtin:service:association_reg
          services.mosaic: builtin:service:mosaic
          services.pyobj_creg: builtin:service:pyobj_creg
        raw: {}

  bundler:
    type: builtin:type:attribute
    value:
      object: bundler.module
      attr_name: bundler

  bundler.service:
    type: system/system.t:service_template
    value:
      name: bundler
      ctl: base:system/system:actor_dict.config_ctl
      function: bundler
      free_params:
      - ref_list
      - seen_refs
      service_params:
      - pick_refs
      want_config: false
