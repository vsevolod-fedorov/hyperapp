  subprocess_server_running.service-actor:
    type: :system/system.t:service_actor
    value:
      fn: subprocess_server_running
      adapters:
      - subprocess_server_running.service-args-adapter
      - :system/adapter:service_object.adapter

  subprocess_server_running.service-args-adapter:
    type: :system/adapter.t:service_args_adapter
    value:
      args:
        transport: :transport/transport:transport.service
        subprocess_running: subprocess_running:subprocess_running.service
