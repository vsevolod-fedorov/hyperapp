import:
- builtin:type:attribute
- builtin:type:python_module
- base:record_config.t:config_ctl
- legacy_type.system:service_template
- legacy_type.transport:config

definitions:

  transport.module:
    type: builtin:type:python_module
    value:
      module_name: transport
      file_name: transport.dyn.py
      imports:
        pyobj: {}
        raw: {}

    transport:
      type: builtin:type:attribute
      value:
        object: transport.module
        attr_name: transport
      raw: {}

  record_config-config.ctl:
    type: :record_config.t:config_ctl
    value:
      t: legacy_type.transport:config

  transport.service:
    type: :system/system.t:service_template
    value:
      name: transport
      ctl: record_config-config.ctl
      function: transport
      free_params: []
      service_params:
      - bundler
      - route_table
      - transport_log
      want_config: true
