      function: assoc_key_creg
      free_params: []
      service_params: []
      want_config: true

  init_assoc_key:
    type: builtin:type:attribute
    value:
      object: assoc_key.module
      attr_name: init_assoc_key

  init_assoc_key.fn:
    type: system_fn.t:ctx_fn
    value:
      function: init_assoc_key
