definitions:

  import.module:
    type: builtin:type:python_module
    value:
      module_name: import
      file_name: import.dyn.py
      imports:
        pyobj:
          htypes.test_job.test_function: test.t:test_function
          htypes.import_job.succeeded_result: import.t:succeeded_result
          htypes.import_job.incomplete_result: import.t:incomplete_result
          htypes.import_job.failed_result: import.t:failed_result
          htypes.import_job.internal_error_result: import.t:internal_error_result
          services.pyobj_creg: builtin:service:pyobj_creg
          services.mosaic: builtin:service:mosaic
          services.web: builtin:service:web
          code.context: context:context.module
          code.ctr_collector: :ctr_collector:ctr_collector.module
          code.path: :path:path.module
          code.import_recorder: :import_recorder:import_recorder.module
          code.probe: :probe:probe.module
        raw: {}

  run_import_job.attr:
    type: builtin:type:attribute
    value:
      object: import.module
      attr_name: run_import_job

  run_import_job.actor:
    type: base:system/system.t:actor
    value:
      fn: run_import_job.attr
      service_params:
        import_to_req: import_to_req:import_to_req.service
        marker_registry: marker_registry:marker_registry.service
        subsystem_factory: base:system/system:subsystem_factory.service
        transport: base:transport/transport:transport.service
