definitions:

  compile.module:
    type: builtin:type:python_module
    value:
      module_name: compile
      file_name: compile.dyn.py
      imports:
        pyobj:
          services.load_resources: builtin:service:load_resources
          services.mosaic: builtin:service:mosaic
          code.module: module:module.module
          code.transport: base:transport/transport:transport.module
          code.path: path:path.module
          code.target.import_target: target/import:import.module
          code.target.module: target/module:module.module
          code.target.project: target/project:project.module
          code.target.state: target/state:state.module
          code.target.test: target/test:test.module
          code.target_set: target/set:set.module
        raw:
          data.worker.config: worker_config:config

  compile_resources.attr:
    type: builtin:type:attribute
    value:
      object: compile.module
      attr_name: compile_resources

  compile_resources.service.t:
    type: builtin:type:record_mt
    value:
      name: compile_resources
      base: null
      fields: {}

  compile_resources.service:
    type: compile_resources.service.t
    value: {}

  compile_resources.service-actor:
    type: base:system/system.t:service_actor
    value:
      fn: compile_resources.attr
      adapters:
      - compile_resources.service-args-adapter

  compile_resources.service-args-adapter:
    type: base:system/adapter.t:service_args_adapter
    value:
      args:
        generate_rsa_identity: base:transport/rsa:generate_rsa_identity.service
        subprocess_workers_running: base:subprocess/worker:subprocess_workers_running.service
        transport: base:transport/transport:transport.service
        message_creg: base:transport/registries:message_creg.service
        selectors: base:transport/selectors:selectors.service
        job_pool: job_pool:job_pool.service
        name_resources: base:resource/name:name_resources.service
        dump_resource_modules: base:resource/dump:dump_resource_modules.service
