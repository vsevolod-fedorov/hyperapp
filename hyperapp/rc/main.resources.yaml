definitions:

  main.module:
    type: builtin:type:python_module
    value:
      module_name: main
      file_name: main.dyn.py
      imports:
        pyobj:
          code.source_path: base:source_path:source_path.module
          code.transport: base:transport/transport:transport.module
        raw: {}

  main.attr:
    type: builtin:type:attribute
    value:
      object: main.module
      attr_name: main

  main.service.t:
    type: builtin:type:record_mt
    value:
      name: main
      base: null
      fields: {}

  main.service:
    type: main.service.t
    value: {}

  main.service-actor:
    type: base:system/system.t:service_actor
    value:
      fn: main.attr
      adapters:
      - main.service-args-adapter

  main.service-args-adapter:
    type: base:system/adapter.t:service_args_adapter
    value:
      args:
        assoc_pickers: base:assoc_pickers:assoc_pickers.service
        assoc_implanter: base:assoc_implanter:assoc_implanter.service
        identity_creg: base:transport/registries:identity_creg.service
        generate_rsa_identity: base:transport/rsa:generate_rsa_identity.service
        subprocess_workers_running: base:subprocess/worker:subprocess_workers_running.service
        selectors: base:transport/selectors:selectors.service
        transport: base:transport/transport:transport.service
        message_creg: base:transport/registries:message_creg.service
        compile_resources: compile:compile_resources.service
