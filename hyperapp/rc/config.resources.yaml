definitions:

  config:
    type: base:system/system.t:system_config
    value:
      services:
        base:system/system:service_config_creg.service: service_config_creg.config
        base:system/system:service_creg.service: service_creg.config
        base:transport/registries:message_creg.service: message_creg.config
        base:transport/transport:transport.service: transport.config

  service_config_creg.config:
    type: base:system/system.t:typed_item_list
    value:
      items: {}

  service_creg.config:
    type: base:system/system.t:typed_item_list
    value:
      items:
        compile:compile_resources.service.t: compile:compile_resources.service-actor
        main:main.service.t: main:main.service-actor

  message_creg.config:
    type: base:system/system.t:typed_item_list
    value:
      items:
        job/import.t:succeeded_result: job/import_result:succeeded_result.actor
        job/import.t:failed_result: job/import_result:failed_result.actor

  transport.config:
    type: base:transport/transport.t:config
    value:
      message_size_limit: null
