definitions:

  config:
    type: base:system/system.t:system_config
    value:
      services:
        base:system/system:service_config_creg.service: service_config_creg.config
        base:system/system:service_creg.service: service_creg.config
        base:transport/registries:message_creg.service: message_creg.config
        base:transport/transport:transport.service: transport.config
        requirement_creg:requirement_creg.service: requirement_creg.config

  service_config_creg.config:
    type: base:system/system.t:typed_item_list
    value:
      items:
        requirement_creg:requirement_creg.service.t: base:system/config:TypedDictConfigCtl.from_service_piece.actor

  service_creg.config:
    type: base:system/system.t:typed_item_list
    value:
      items:
        compile:compile_resources.service.t: compile:compile_resources.service-actor
        job_pool:job_pool.service.t: job_pool:job_pool.service-actor
        main:main.service.t: main:main.service-actor
        requirement_creg:requirement_creg.service.t: requirement_creg:requirement_creg.service-actor

  message_creg.config:
    type: base:system/system.t:typed_item_list
    value:
      items:
        job/import.t:succeeded_result: target/import:succeeded_result.actor
        job/import.t:incomplete_result: target/import:incomplete_result.actor
        job/import.t:failed_result: target/import:failed_result.actor
        job/import.t:internal_error_result: target/import:internal_error_result.actor
        job/test.t:succeeded_result: target/test:succeeded_result.actor
        job/test.t:incomplete_result: target/test:incomplete_result.actor
        job/test.t:failed_result: target/test:failed_result.actor
        job/test.t:internal_error_result: target/test:internal_error_result.actor

  transport.config:
    type: base:transport/transport.t:config
    value:
      message_size_limit: null

  requirement_creg.config:
    type: base:system/system.t:typed_item_list
    value:
      items:
        code_req.t:code_req: code_req:CodeReq.from_piece.actor
        code_req.t:tested_code_req: code_req:TestedCodeReq.from_piece.actor
        type_req.t:type_req: type_req:TypeReq.from_piece.actor
        boot_service_req.t:boot_service_req: boot_service_req:BootServiceReq.from_piece.actor
