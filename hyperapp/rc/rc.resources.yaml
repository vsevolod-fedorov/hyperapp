definitions:

  rc.module:
    type: builtin:type:python_module
    value:
      module_name: rc
      file_name: rc.dyn.py
      imports:
        pyobj:
          htypes.rpc.server_error: base:rpc/rpc.t:server_error
          services.hyperapp_dir: builtin:service:hyperapp_dir
          services.project_factory: builtin:service:project_factory
          code.init_targets: init_targets:init_targets.module
          code.job_cache: job_cache:job_cache.module
          code.reconstructors: base.reconstructors:reconstructors.module
          code.rc_constants: rc_constants:rc_constants.module
          code.rc_filter: rc_filter:rc_filter.module
          code.target_set: target_set:target_set.module
        raw: {}

  compile_resources:
    type: builtin:type:attribute
    value:
      object: rc.module
      attr_name: compile_resources

  compile_resources.service:
    type: base:system/system.t:service_template
    value:
      name: compile_resources
      ctl: base.system.system:actor_dict.config_ctl
      function: compile_resources
      free_params:
      - name_to_project
      - pool
      - targets
      - options
      service_params:
      - system
      - get_layer_config_templates
      - config_ctl
      - ctr_from_template_creg
      - rc_job_result_creg
      - job_cache
      want_config: false

  rc_main:
    type: builtin:type:attribute
    value:
      object: rc.module
      attr_name: rc_main

  rc_main.service:
    type: base:system/system.t:service_template
    value:
      name: rc_main
      ctl: base.system.system:actor_dict.config_ctl
      function: rc_main
      free_params:
      - name_to_project
      - sys_argv
      service_params:
      - process_pool_running
      - compile_resources
      want_config: false
